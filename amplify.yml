version: 1
backend:
  phases:
    build:
      commands:
        - echo "Current branch is $AWS_BRANCH"
        - npm ci
        # ↓ これを追加して、一度だけ強制的に初期化させる
        - npx ampx bootstrap --branch $AWS_BRANCH --app-id $AWS_APP_ID
        # ↓ その後、通常通りデプロイ
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*