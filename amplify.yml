version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        # --branch で現在のブランチ名を明示的に渡す
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next # Next.jsの場合。React(Vite)なら dist
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*