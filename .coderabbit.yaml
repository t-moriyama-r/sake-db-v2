# CodeRabbit 設定
# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: 'ja-JP'

reviews:
  profile: 'chill'
  high_level_summary: true
  poem: false
  path_filters:
    - '!sake-db/**' # 旧版（参照用・編集禁止）はレビュー対象外
    - '!package-lock.json'
  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        このリポジトリのコーディングルールは .claude/agents/coding/coding-rules.md に定義されている。
        特に以下を確認すること:
        - URL の直書き禁止（lib/routes.ts の routes オブジェクトを使う）
        - list() の limit 打ち切り禁止（lib/amplify-list.ts の fetchAll を使う）
        - useState のジェネリクス明示、catch (e: unknown)、再エクスポート禁止
        - eslint-disable / @ts-ignore による抑止は禁止（根本原因を修正する）
        - ログメッセージは日本語

chat:
  auto_reply: true
